name: Sync repository from ZIP

on:
  push:
    paths:
      - "amaal-erp-repository-skeleton.zip"
      - ".github/workflows/zip-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "amaal-erp-repository-skeleton.zip" ]; then
            echo "ERROR: amaal-erp-repository-skeleton.zip was not found."
            exit 1
          fi

          unzip -t "amaal-erp-repository-skeleton.zip"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .sync-staging
          mkdir -p .sync-staging

          unzip -q "amaal-erp-repository-skeleton.zip" -d .sync-staging

      - name: Locate repository root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=".sync-staging"

          if [ -d "$ROOT/amaal-repo" ]; then
            ROOT="$ROOT/amaal-repo"
          elif [ -d "$ROOT/amaal-erp-repository-skeleton" ]; then
            ROOT="$ROOT/amaal-erp-repository-skeleton"
          fi

          echo "SYNC_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Using extracted root: $ROOT"

      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .sync-backup

          # Preserve the ZIP source and this workflow.
          cp "amaal-erp-repository-skeleton.zip" .sync-backup/

          mkdir -p .sync-backup/workflow
          cp ".github/workflows/zip-sync.yml" \
             .sync-backup/workflow/zip-sync.yml

          # Remove previous generated repository contents.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".sync-staging" \
            ! -name ".sync-backup" \
            -exec rm -rf {} +

          # Copy new repository contents.
          cp -a "$SYNC_ROOT"/. .

          # Remove any workflows supplied inside the ZIP.
          # This prevents the GitHub App from trying to create
          # additional workflow files without workflow permission.
          rm -rf .github/workflows

          # Restore only our sync workflow.
          mkdir -p .github/workflows
          cp ".sync-backup/workflow/zip-sync.yml" \
             ".github/workflows/zip-sync.yml"

          # Restore the source ZIP.
          cp ".sync-backup/amaal-erp-repository-skeleton.zip" \
             "amaal-erp-repository-skeleton.zip"

      - name: Remove staging files
        shell: bash
        run: |
          rm -rf .sync-staging .sync-backup

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: sync repository from ZIP"

      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:${GITHUB_REF_NAME}

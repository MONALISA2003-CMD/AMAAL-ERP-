name: Sync repository from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'amaal-erp-repository-skeleton.zip'

permissions:
  contents: write

concurrency:
  group: zip-sync
  cancel-in-progress: false

env:
  SOURCE_ZIP: amaal-erp-repository-skeleton.zip

jobs:
  extract-and-replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || {
            echo "ERROR: $SOURCE_ZIP was not found."
            exit 1
          }
          unzip -t "$SOURCE_ZIP" >/dev/null

      - name: Extract ZIP to staging directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .zip-sync-staging
          mkdir -p .zip-sync-staging
          unzip -q "$SOURCE_ZIP" -d .zip-sync-staging

      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail

          # Preserve only the bootstrap workflow while replacing the application tree.
          mkdir -p .zip-sync-preserve/.github/workflows
          cp .github/workflows/zip-sync.yml .zip-sync-preserve/.github/workflows/zip-sync.yml

          # Delete the previous extracted contents. Keep Git metadata, the source ZIP,
          # and temporary staging/preservation directories until this step is complete.
          find . -mindepth 1 -maxdepth 1 \\
            ! -name '.git' \\
            ! -name "$SOURCE_ZIP" \\
            ! -name '.zip-sync-staging' \\
            ! -name '.zip-sync-preserve' \\
            -exec rm -rf {} +

          # Restore the bootstrap workflow before copying the new package.
          mkdir -p .github/workflows
          cp .zip-sync-preserve/.github/workflows/zip-sync.yml .github/workflows/zip-sync.yml

          # Support ZIPs created either with a single wrapper directory (for example
          # amaal-repo/) or with files directly at the archive root.
          mapfile -t top_entries < <(find .zip-sync-staging -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          if [ "${#top_entries[@]}" -eq 1 ] && [ -d ".zip-sync-staging/${top_entries[0]}" ]; then
            cp -a ".zip-sync-staging/${top_entries[0]}/." .
          else
            cp -a .zip-sync-staging/. .
          fi

          # Always keep this bootstrap workflow, even if the incoming ZIP contains
          # a different .github directory.
          mkdir -p .github/workflows
          cp .zip-sync-preserve/.github/workflows/zip-sync.yml .github/workflows/zip-sync.yml

          rm -rf .zip-sync-staging .zip-sync-preserve

      - name: Commit extracted repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A

          if git diff --cached --quiet; then
            echo 'No repository changes detected after extraction.'
            exit 0
          fi

          git commit -m 'chore: sync repository from ZIP'
          git push origin "HEAD:${GITHUB_REF_NAME}"

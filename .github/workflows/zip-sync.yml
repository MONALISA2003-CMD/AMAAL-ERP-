name: Sync repository from ZIP

on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/zip-sync.yml"

  workflow_dispatch:
    inputs:
      zip_name:
        description: "Optional ZIP path. Leave blank to auto-detect."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: amaal-zip-sync
  cancel-in-progress: false

jobs:
  extract-and-replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Find ZIP package
        id: find_zip
        shell: bash
        env:
          ZIP_INPUT: ${{ inputs.zip_name }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ZIP_PATH=""

          # Manual workflow run with an explicit ZIP path.
          if [ -n "${ZIP_INPUT}" ]; then
            if [ ! -f "${ZIP_INPUT}" ]; then
              echo "ERROR: ZIP file not found: ${ZIP_INPUT}"
              exit 1
            fi

            ZIP_PATH="${ZIP_INPUT}"
          fi

          # Automatic run:
          # find the ZIP changed by the triggering commit.
          if [ -z "${ZIP_PATH}" ] && [ "${EVENT_NAME}" = "push" ]; then
            while IFS= read -r candidate; do
              if [ -f "${candidate}" ]; then
                ZIP_PATH="${candidate}"
                break
              fi
            done < <(
              git diff-tree \
                --no-commit-id \
                --name-only \
                -r \
                "${SHA}" \
                | grep -Ei '\.zip$' || true
            )
          fi

          # Fallback:
          # if exactly one ZIP exists, use it.
          if [ -z "${ZIP_PATH}" ]; then
            mapfile -t ZIP_FILES < <(
              find . \
                -type f \
                -iname '*.zip' \
                -not -path './.git/*' \
                -not -path './.sync-staging/*' \
                -not -path './.sync-backup/*' \
                | sort
            )

            if [ "${#ZIP_FILES[@]}" -eq 1 ]; then
              ZIP_PATH="${ZIP_FILES[0]}"

            elif [ "${#ZIP_FILES[@]}" -eq 0 ]; then
              echo "ERROR: No ZIP package was found."
              exit 1

            else
              echo "ERROR: Multiple ZIP packages were found:"
              printf '  %s\n' "${ZIP_FILES[@]}"
              echo ""
              echo "Provide the ZIP path using workflow_dispatch."
              exit 1
            fi
          fi

          ZIP_PATH="${ZIP_PATH#./}"

          echo "ZIP_PATH=${ZIP_PATH}" >> "${GITHUB_ENV}"

          echo "Selected ZIP:"
          echo "${ZIP_PATH}"

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating ${ZIP_PATH}"

          unzip -t "${ZIP_PATH}"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .sync-staging
          mkdir -p .sync-staging

          unzip -q "${ZIP_PATH}" -d .sync-staging

      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=".sync-staging"

          mapfile -t TOP_LEVEL < <(
            find .sync-staging \
              -mindepth 1 \
              -maxdepth 1 \
              -printf '%f\n' \
              | sort
          )

          # Supports:
          #
          # ZIP
          # ├── apps/
          # ├── packages/
          # └── package.json
          #
          # and:
          #
          # ZIP
          # └── amaal-ERP/
          #     ├── apps/
          #     └── package.json

          if [ "${#TOP_LEVEL[@]}" -eq 1 ] \
             && [ -d ".sync-staging/${TOP_LEVEL[0]}" ]; then

            ROOT=".sync-staging/${TOP_LEVEL[0]}"
          fi

          echo "SYNC_ROOT=${ROOT}" >> "${GITHUB_ENV}"

          echo "Project root:"
          echo "${ROOT}"

      - name: Preserve workflow
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .sync-backup
          mkdir -p .sync-backup/workflow

          cp \
            ".github/workflows/zip-sync.yml" \
            ".sync-backup/workflow/zip-sync.yml"

      - name: Replace old repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing previous repository contents..."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".sync-staging" \
            ! -name ".sync-backup" \
            -exec rm -rf {} +

          echo "Copying new repository..."

          cp -a "${SYNC_ROOT}"/. .

          # ZIP files must never become part of the final repository.
          find . \
            -type f \
            -iname '*.zip' \
            -not -path './.git/*' \
            -delete

          # Do not allow the uploaded ZIP to introduce
          # arbitrary GitHub Actions workflows.
          rm -rf .github/workflows

          mkdir -p .github/workflows

          # Restore only this trusted synchronization workflow.
          cp \
            ".sync-backup/workflow/zip-sync.yml" \
            ".github/workflows/zip-sync.yml"

      - name: Remove temporary files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .sync-staging
          rm -rf .sync-backup

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit \
            -m "chore: sync repository from ZIP"

      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"

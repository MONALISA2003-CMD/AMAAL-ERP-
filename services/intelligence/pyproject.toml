[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amaal-intelligence"
version = "9.1.0"
description = "Governed Python intelligence layer for Amaal ERP"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]==3.3.6",
  "numpy==2.5.3",
  "scikit-learn==1.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
